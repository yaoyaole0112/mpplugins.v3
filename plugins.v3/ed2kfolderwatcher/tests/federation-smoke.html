<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ED2K federation smoke</title></head><body>
<main id="app"></main><pre id="result">running</pre>
<script type="module">
import * as vue from '../node_modules/vue/dist/vue.esm-browser.prod.js'
import * as remote from '../dist/assets/remoteEntry.js'

const settings = { enabled: false, folder: '/media/test', recursive: true, monitor_enabled: true,
  output_enabled: true, output: '', extensions: '', min_age: 60, delete_source: false,
  scan_enabled: false, cron: '*/10 * * * *', telegram_enabled: false, telegram_mode: 'user',
  telegram_chat_id: '', telegram_thread_id: '', telegram_token: '' }
Object.assign(settings, { cloud_enabled: false, cloud_scan_enabled: false, cloud_storage: '115网盘Plus', cloud_folder: '', cloud_recursive: true, cloud_cron: '*/10 * * * *', cloud_read_timeout: 300, cloud_monitor_enabled: false, cloud_life_source: 'shared' })
let requests = []
let mode = 'normal'
let closes = 0
let copied = ''
let copyFails = false
let fallbackWorks = true
let confirmDelete = false
const deletions = []
Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { writeText: async value => {
  if (copyFails) throw Error('Clipboard denied')
  copied = value
} } })
document.execCommand = command => {
  if (command !== 'copy' || !fallbackWorks) return false
  const field = document.querySelector('#app .records-page > textarea')
  if (!field || document.activeElement !== field || field.selectionStart !== 0 || field.selectionEnd !== field.value.length) return false
  copied = field.value
  return true
}
window.confirm = () => confirmDelete
const intervals = new Map()
const originalSetInterval = window.setInterval.bind(window)
const originalClearInterval = window.clearInterval.bind(window)
window.setInterval = (callback, delay, ...args) => {
  const identifier = originalSetInterval(callback, delay, ...args)
  intervals.set(identifier, delay)
  return identifier
}
window.clearInterval = identifier => {
  intervals.delete(identifier)
  originalClearInterval(identifier)
}
const rows = ['deleted', 'retained', 'delete_failed', 'unknown'].map((source_status, index) => ({
  id: String(index).repeat(64), can_delete: index === 1 || index === 2, link_valid: true,
  name: `测试文件 ${index}.mkv`, link: `ed2k://|file|测试文件 ${index}.mkv|5|hash|/`,
  generated_at: index ? null : 1700000000, source_status,
}))
rows.push({ id: 'f'.repeat(64), name: '历史空文件.mkv', link: 'ed2k://|file|历史空文件.mkv|0|31d6cfe0d16ae931b73c59d7e0c089c0|/', link_valid: false, link_error: '历史链接无效：当时文件大小为 0', can_delete: false, source_status: 'retained' })
const api = { get: async path => {
  requests.push(path)
  if (path.endsWith('/cloud/status')) return { ok: true, storages: [{ type: '115网盘Plus', name: '115网盘Plus' }], scanning: false, pending: 0, file: '', bytes_read: 0, size: 0, error: '' }
  if (path.endsWith('/records')) return mode === 'error' ? { ok: false, message: '模拟读取失败' }
    : { ok: true, items: mode === 'empty' ? [] : rows.map(row => ({ ...row })), total: mode === 'empty' ? 0 : rows.length, delete_source_enabled: false }
  return path.endsWith('/settings') ? { ok: true, settings }
    : { ok: true, logged_in: false, pending: false, api_id: '', api_hash_configured: false }
}, post: async (path, body) => {
  requests.push(path)
  if (path.endsWith('/cloud/browse')) return { ok: true, path: body.path, folders: body.path === '/' ? [{ name: '测试网盘目录', path: '/测试网盘目录/' }] : [] }
  if (path.endsWith('/records/delete-source')) {
    if (body.id !== '1'.repeat(64) || body.confirm !== true || Object.keys(body).length !== 2) throw Error('Unsafe delete payload')
    deletions.push(body)
    return { ok: true, message: '源文件已删除，ED2K 链接及记录已保留' }
  }
  if (!path.endsWith('/settings')) throw Error('Unexpected write request')
  if (typeof body.cloud_scan_enabled !== 'boolean') throw Error('Cloud schedule switch missing from save payload')
  return { ok: true, settings: body, message: '模拟保存成功' }
} }

try {
  remote.init({ vue: { [vue.version]: { get: () => () => vue, loaded: true } } })
  for (const name of ['./Page', './Config', './AppPage']) {
    const factory = await remote.get(name)
    requests = []
    const app = vue.createApp(factory(), { api, pluginId: 'Ed2kFolderWatcher', onClose: () => { closes++ } })
    app.mount('#app')
    await new Promise(resolve => setTimeout(resolve, 100))
    if (document.querySelector('#app [role=alert]')) throw Error(`${name}: API failed`)
    if (document.querySelector('#app').innerText.includes('Bot Token')) throw Error(`${name}: bot settings visible`)
    if (document.querySelector('#app option[value=bot]')) throw Error(`${name}: bot mode selectable`)
    let buttons = [...document.querySelectorAll('#app button')]
    if (name !== './Config') {
      const text = document.querySelector('#app').innerText
      if (!text.includes('最近生成记录') || !text.includes('测试文件 0.mkv')) throw Error(`${name}: recent records missing`)
      for (const label of ['已删除源文件', '未删除源文件', '删除失败，源文件保留', '历史记录：删源状态未记录']) {
        if (!text.includes(label)) throw Error(`${name}: status missing: ${label}`)
      }
      if (text.includes('保存插件设置') || text.includes('保存账号设置') || document.querySelector('#app input')) throw Error(`${name}: configuration leaked into viewing page`)
      if (requests.some(path => !path.endsWith('/records'))) throw Error(`${name}: viewing page requested settings`)
      await document.fonts.ready
      await new Promise(resolve => setTimeout(resolve, 100))
      const page = document.querySelector('#app .records-page')
      const list = page.querySelector('.records-list')
      const firstCard = list.querySelector('.record')
      if (page.getBoundingClientRect().height > innerHeight * .85 + 1 || page.scrollHeight > page.clientHeight + 1) throw Error(`${name}: outer page overflows`)
      if (getComputedStyle(list).overflowY !== 'auto' || getComputedStyle(list).scrollbarGutter !== 'stable') throw Error(`${name}: list scrollbar missing reserved space`)
      if (firstCard.querySelector('.copy-feedback').getBoundingClientRect().height !== 20 || parseFloat(getComputedStyle(firstCard).paddingBottom) > 12) throw Error(`${name}: card whitespace not compact`)
      const headerTop = page.querySelector('.records-header').getBoundingClientRect().top
      list.scrollTop = list.scrollHeight
      if (list.scrollTop <= 0 || page.querySelector('.records-header').getBoundingClientRect().top !== headerTop || page.scrollTop !== 0) throw Error(`${name}: list does not scroll independently of header`)
      if (list.lastElementChild.getBoundingClientRect().bottom > list.getBoundingClientRect().bottom + 1) throw Error(`${name}: last record is clipped`)
      list.scrollTop = 0
      const invalid = [...document.querySelectorAll('#app .record')].find(record => record.textContent.includes('历史空文件'))
      if (!invalid?.textContent.includes('历史链接无效') || invalid.querySelector('.copy-link') || invalid.querySelector('.delete-source')) throw Error(`${name}: invalid link actions available`)
      const link = document.querySelector('#app .copy-link')
      if (document.querySelector('#app details') || getComputedStyle(link).display === 'none') throw Error(`${name}: ED2K links are collapsed`)
      const recordLayout = () => [...document.querySelectorAll('#app .record, #app .record-heading, #app .record h3, #app .record-time, #app .copy-link, #app .source-status, #app .copy-feedback')].map(element => {
        const bounds = element.getBoundingClientRect()
        return [bounds.top, bounds.left, bounds.width, bounds.height]
      })
      const initialLayout = JSON.stringify(recordLayout())
      const assertStableCopy = () => {
        if (JSON.stringify(recordLayout()) !== initialLayout) throw Error(`${name}: record dimensions or text positions changed during copying`)
        if (document.querySelector('#app .records-page > .notice') || document.querySelector('#app .records-page > [role=alert]')) throw Error(`${name}: copy feedback leaked above records`)
      }
      copyFails = true
      link.click()
      await new Promise(resolve => setTimeout(resolve, 50))
      if (copied !== rows[0].link || !link.nextElementSibling.textContent.includes('链接已复制')) throw Error(`${name}: clipboard copy failed`)
      assertStableCopy()
      copyFails = false
      fallbackWorks = false
      copied = ''
      link.click()
      await new Promise(resolve => setTimeout(resolve, 50))
      if (copied !== rows[0].link || document.querySelector('#app .records-page > textarea')) throw Error(`${name}: modern copy failed or leaked textarea`)
      assertStableCopy()
      copyFails = true
      link.click()
      await new Promise(resolve => setTimeout(resolve, 50))
      if (!link.nextElementSibling.textContent.includes('复制受限') || window.getSelection().toString() !== rows[0].link) throw Error(`${name}: clipboard failure not reported or link not selected`)
      assertStableCopy()
      copyFails = false
      fallbackWorks = true
      document.querySelectorAll('#app .copy-link')[1].click()
      await new Promise(resolve => setTimeout(resolve, 50))
      assertStableCopy()
      if (link.nextElementSibling.textContent) throw Error(`${name}: previous copy feedback not cleared`)
      const deleteButton = document.querySelector('#app .delete-source')
      const sourceStatus = deleteButton.nextElementSibling
      const deleteRect = deleteButton.getBoundingClientRect()
      const statusRect = sourceStatus.getBoundingClientRect()
      if (!sourceStatus.classList.contains('source-status') || sourceStatus.textContent !== '未删除源文件') throw Error(`${name}: delete button not before retained status`)
      if (deleteRect.width !== statusRect.width || deleteRect.height !== statusRect.height || deleteRect.right > statusRect.left || deleteRect.top !== statusRect.top) throw Error(`${name}: source actions not aligned or equally sized`)
      const previousDeletes = deletions.length
      deleteButton.click()
      await new Promise(resolve => setTimeout(resolve, 50))
      if (deletions.length !== previousDeletes) throw Error(`${name}: deletion without confirmation`)
      confirmDelete = true
      const retainedRecord = deleteButton.closest('.record')
      deleteButton.click()
      await new Promise(resolve => setTimeout(resolve, 100))
      confirmDelete = false
      if (deletions.length !== previousDeletes + 1 || !retainedRecord.textContent.includes('已删除源文件') || retainedRecord.querySelector('.delete-source')) throw Error(`${name}: manual delete state not updated`)
      const actions = [...document.querySelectorAll('#app .records-actions button')]
      if (actions.map(button => button.textContent.trim()).join('|') !== '刷新记录|设置|关闭') throw Error(`${name}: record action order incorrect`)
      if (!Array.from(intervals.values()).includes(15000)) throw Error(`${name}: record polling missing`)
      mode = 'empty'
      buttons.find(button => button.textContent.trim() === '刷新记录').click()
      await new Promise(resolve => setTimeout(resolve, 100))
      if (!document.querySelector('#app').innerText.includes('暂无生成记录')) throw Error(`${name}: empty state missing`)
      mode = 'error'
      buttons.find(button => button.textContent.trim() === '刷新记录').click()
      await new Promise(resolve => setTimeout(resolve, 100))
      if (!document.querySelector('#app [role=alert]')?.textContent.includes('模拟读取失败')) throw Error(`${name}: error state missing`)
      mode = 'normal'
      buttons.find(button => button.textContent.trim() === '设置').click()
      await new Promise(resolve => setTimeout(resolve, 100))
      if (document.querySelector('#app .records-page')) throw Error(`${name}: settings did not replace records page`)
      if (!requests.some(path => path.endsWith('/settings'))) throw Error(`${name}: settings not loaded after click`)
      if (Array.from(intervals.values()).includes(15000)) throw Error(`${name}: record polling continued in settings`)
      buttons = [...document.querySelectorAll('#app button')]
    }
    if (!document.querySelector('#app').innerText.includes('Telegram 账号')) throw Error(`${name}: account panel missing`)
    const cloudPanel = document.querySelector('#app [data-testid=cloud-source]')
    if (!cloudPanel || !cloudPanel.textContent.includes('不会删除云端文件') || cloudPanel.querySelector('input[type=checkbox]').checked) throw Error(`${name}: cloud defaults are unsafe or panel missing`)
    const commonPanel = document.querySelector('#app [data-testid=common-settings]')
    const localPanel = document.querySelector('#app [data-testid=local-source]')
    for (const heading of ['通用设置', '本地监控', '网盘监控', 'ED2K链接自动转发']) {
      if (![...document.querySelectorAll('#app h3')].some(element => element.textContent === heading)) throw Error(`${name}: missing heading ${heading}`)
    }
    const scheduleSwitch = [...cloudPanel.querySelectorAll('label')].find(label => label.textContent.trim() === '网盘定时增量补扫').querySelector('input')
    const scheduleInput = [...cloudPanel.querySelectorAll('label')].find(label => label.textContent.startsWith('网盘补扫计划')).querySelector('input')
    if (scheduleSwitch.checked || !scheduleInput.disabled) throw Error(`${name}: cloud schedule input enabled while switch off`)
    scheduleSwitch.click()
    await vue.nextTick()
    if (scheduleInput.disabled) throw Error(`${name}: cloud schedule input disabled while switch on`)
    scheduleSwitch.click()
    await vue.nextTick()
    if (!scheduleInput.disabled) throw Error(`${name}: cloud schedule input did not disable`)
    if (![...cloudPanel.querySelectorAll('label')].some(label => label.textContent.startsWith('网盘监控目录'))) throw Error(`${name}: cloud folder label not renamed`)
    if (!commonPanel || !localPanel || !commonPanel.textContent.includes('扩展名过滤') || !commonPanel.textContent.includes('TXT 输出路径') || commonPanel.textContent.includes('删除本地源文件') || !localPanel.textContent.includes('删除本地源文件') || localPanel.textContent.includes('TXT 输出路径')) throw Error(`${name}: common and local settings are mixed`)
    const lifeSwitch = [...cloudPanel.querySelectorAll('label')].find(label => label.textContent.includes('115生活事件监控')).querySelector('input')
    if (lifeSwitch.checked || cloudPanel.querySelector('input[max="1800"]').value !== '300') throw Error(`${name}: unsafe life or timeout defaults`)
    lifeSwitch.click()
    await vue.nextTick()
    const lifeSelect = [...cloudPanel.querySelectorAll('label')].find(label => label.textContent.includes('115生活事件来源')).querySelector('select')
    if (lifeSelect.value !== 'shared' || !lifeSelect.textContent.includes('每分钟一次生活接口')) throw Error(`${name}: life source modes missing`)
    lifeSwitch.click()
    await vue.nextTick()
    buttons.find(button => button.textContent.trim() === '浏览网盘目录').click()
    await new Promise(resolve => setTimeout(resolve, 100))
    const folder = [...document.querySelectorAll('#app .cloud-folders button')].find(button => button.textContent === '测试网盘目录')
    if (!folder) throw Error(`${name}: cloud directory browsing failed`)
    folder.click()
    await new Promise(resolve => setTimeout(resolve, 100))
    document.querySelectorAll('#app .cloud-browser .actions button')[1].click()
    await vue.nextTick()
    if (cloudPanel.querySelector('.fields input').value !== '/测试网盘目录/') throw Error(`${name}: choosing cloud folder failed`)
    const targets = document.querySelector('#app textarea')
    if (!targets || targets.rows !== 1 || !document.querySelector('#app').innerText.includes('接收目标（支持多个）')) throw Error(`${name}: compact multiple target textarea missing`)
    const threadInput = document.querySelector('#app .telegram-targets input')
    if (!threadInput || Math.abs(targets.getBoundingClientRect().height - threadInput.getBoundingClientRect().height) > 1) throw Error(`${name}: target and thread input heights differ`)
    if (targets.getBoundingClientRect().height !== 48) throw Error(`${name}: target input not compact`)
    if (getComputedStyle(targets).overflowY !== 'hidden') throw Error(`${name}: target scrollbar not hidden`)
    if (getComputedStyle(targets, '::-webkit-scrollbar').display !== 'none') throw Error(`${name}: target scrollbar still visible`)
    targets.value = '@receiver_bot\n@channel\n-1001234567890'
    targets.dispatchEvent(new Event('input', { bubbles: true }))
    await vue.nextTick()
    if (!targets.value.includes('\n@channel\n')) throw Error(`${name}: multiline input lost`)
    buttons.find(button => button.textContent.trim() === '保存插件设置').click()
    await new Promise(resolve => setTimeout(resolve, 100))
    if (!document.querySelector('#app').innerText.includes('模拟保存成功')) throw Error(`${name}: settings save failed`)
    if (buttons.filter(button => button.textContent.trim() === '保存插件设置').length !== 1) throw Error(`${name}: duplicate plugin save buttons`)
    if (buttons.filter(button => button.textContent.trim() === '保存账号设置').length !== 1) throw Error(`${name}: account save missing`)
    const headerButtons = [...document.querySelectorAll('#app .ed2k-header .header-actions button')]
    if (headerButtons.map(button => button.textContent.trim()).join('|') !== '保存插件设置|增量补扫／补发链接|关闭') throw Error(`${name}: header button order incorrect`)
    if (document.querySelector('#app footer')) throw Error(`${name}: duplicate footer actions`)
    const header = document.querySelector('#app .header-actions')
    if (header.scrollWidth > header.clientWidth + 2) throw Error(`${name}: header actions overflow`)
    if (document.querySelector('#app').innerText.includes('正在加载设置')) throw Error(`${name}: settings not loaded`)
    const previousCloses = closes
    buttons.find(button => button.textContent.trim() === '关闭').click()
    if (closes !== previousCloses + 1) throw Error(`${name}: config close event lost`)
    app.unmount()
    if (intervals.size) throw Error(`${name}: polling not cleaned up`)
  }
  await Promise.all([...document.querySelectorAll('link[rel=stylesheet]')].map(async link => {
    const response = await fetch(link.href)
    if (!response.ok) throw Error(`stylesheet failed: ${response.status}`)
  }))
  document.body.dataset.result = 'passed'
  document.querySelector('#result').textContent = 'PASS: Page/AppPage show records and source status only; Config keeps settings; empty/error states and CSS loaded'
} catch (error) {
  document.body.dataset.result = 'failed'
  document.querySelector('#result').textContent = String(error)
}
</script></body></html>
