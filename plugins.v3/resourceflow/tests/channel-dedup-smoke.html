<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResourceFlow Shared Arbitration Test</title>
  <link rel="stylesheet" href="../node_modules/vuetify/dist/vuetify.min.css">
  <link rel="stylesheet" href="../node_modules/@mdi/font/css/materialdesignicons.min.css">
  <script type="importmap">
    {"imports":{"vue":"../node_modules/vue/dist/vue.esm-browser.prod.js"}}
  </script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    :root { --app-surface-radius: 8px; --app-control-radius: 6px; }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import * as vue from 'vue'
  import * as vuetify from '../node_modules/vuetify/dist/vuetify.esm.js'
  import * as remote from '../dist/assets/remoteEntry.js'
  import { cloneTask } from '../src/utils.js'

  let savedTask = new URLSearchParams(location.search).get('task') === 'traffic'
    ? cloneTask({ id: 'saved-traffic', name: '【分享】Saved Traffic', site_id: 1, downloader: 'QB',
      spec_dedup_enabled: false }) : null
  const status = {
    enabled: true, show_sidebar_nav: true, tasks: [],
    summary: { task_count: 15, running_count: 14 }, options: { sites: [{ value: 1, title: 'Test Site' }], downloaders: [{ value: 'QB', title: 'QB' }] },
  }
  let settings = {
    enabled: true, channels: ['@example_channel'], attributes: ['resolution', 'effects', 'codec', 'source'],
    size_tolerance_pct: 5, record_count: 2, last_poll_at: Date.now() / 1000, last_error: '',
    unknown_policy: 'exclude', identity_aliases: {}, movie_identity_aliases: {}, cancel_downloading: false,
    inflight_enabled: true, pack_dedup_enabled: true, pack_policy: 'partial', identity_policy: 'defer',
    ledger_count: 1, pending_count: 1,
    poll_interval_seconds: 300, next_poll_at: Date.now() / 1000 + 300,
    records: [1, 2].map(number => ({
      channel: '@example_channel', message_id: 42, file_key: `file-${number}`,
      title: number === 1 ? 'PSYREN 决战游戏' : 'A Very Long Series Name With Several Words',
      tmdb_id: 297903, season: 1, episodes: [number + 4], published_at: Date.now() / 1000,
      specs: { resolution: '1080p', effects: 'SDR', codec: 'H.264', source: 'WEB-DL', fps: 24, size: 1251017826 },
    })),
  }
  const authoritative = new URLSearchParams(location.search).get('authority') === '1'
  settings.shared_authority = authoritative
  window.resourceflowRequests = []
  window.resourceflowFailSave = false
  window.resourceflowFailStage = ''
  window.resourceflowFailSharedLoad = false
  window.resourceflowSlowSearch = false
  let shared = {
    enabled: true, host_coordinator: false, bot_username: '@testbot', group: 'resources',
    last_ok: 1794711660,
    instance_label: '本机测试', instance_id: 'a'.repeat(32), allowed_users: [11, 22], token_configured: true,
    requests: [{ request_id: 'b'.repeat(32), title: 'Show S01E05', phase: 'queued', approved: 1,
      created: 1794711600, updated: 1794711660, task_name: 'Test Site', downloader: 'QB', file_count: 2, completed: 0,
      rejected: [{ id: '2'.repeat(24), reason: '同规格已占位或已完成', owner: '朋友A' }],
      files: [1, 2].map(number => ({ id: String(number).repeat(24),
        path: `Show.S01E0${number + 4}.2026.1080p.WEB-DL.H264.AAC.mkv`, tmdb_id: 123,
        media_title: number === 1 ? '玫瑰战争' : '弱气MAX的大小姐、居然接受了铁腕未婚夫的赌约',
        media_type: 'tv', season: 1, episodes: [number + 4],
        specs: { resolution: '1080p', effects: 'SDR', codec: 'H.264', source: 'WEB-DL', fps: 23.976, size: 1251017826 },
        decision: number === 1 ? 'approved' : 'rejected',
        reason: number === 1 ? '' : '同规格已占位或已完成', owner: number === 1 ? '' : '朋友A',
      })),
    }, { request_id: 'c'.repeat(32), title: 'Approved Request', phase: 'reserved', approved: 2,
      rejected: [], files: [{ media_title: '弱气MAX的大小姐、居然接受了铁腕未婚夫的赌约',
        media_type: 'tv', tmdb_id: 303060, season: 1, episodes: [7],
        specs: { resolution: '1080p', effects: 'SDR', codec: 'H.264', source: 'WEB-DL', size: 1501017826 },
      }] },
    { request_id: 'd'.repeat(32), title: 'Legacy Failure', phase: 'rejected', approved: 0,
      rejected: [], error: '规格数值无效', files: [] },
    { request_id: 'e'.repeat(32), title: 'Pending Verification', phase: 'uncertain', approved: 0,
      rejected: [], files: [] },
    { request_id: 'f'.repeat(32), title: 'Released Request', phase: 'released', approved: 0,
      rejected: [], files: [] }],
    records: [{ id: 'b'.repeat(32), title: 'Show S01E05', label: '朋友A', state: 'reserved', tmdb_id: 123,
      media_title: '玫瑰战争',
      season: 1, episodes: [5], media_type: 'tv', created: 1794711600, updated: 1794711660,
      specs: { resolution: '1080p', effects: 'SDR', fps: 23.976, size: 1251017826 } },
      ...['completed', 'queued', 'released'].map((state, index) => ({
        id: `${state}-${index}`, title: 'Yowaki MAX Reijou na no ni Ratsuwan Konyakusha-sama no Kake ni Notteshimatta 2026 S01E07 1080p CR WEB-DL H264 AAC-UBWEB',
        label: '边城旧事', state, tmdb_id: 303060, media_type: 'tv', season: 1, episodes: [7],
        media_title: '弱气MAX的大小姐、居然接受了铁腕未婚夫的赌约',
        created: 1794711600, updated: 1794711660,
        specs: { resolution: '1080p', effects: 'SDR', codec: 'H.264', source: 'WEB-DL', size: 1501017826 },
      }))],
  }
  if (authoritative) {
    shared.requests[0].claim_links = ['9'.repeat(32)]
    shared.requests[0].rejected[0].claim = '8'.repeat(32)
    shared.records[0].request_id = 'b'.repeat(32)
    shared.integrity_error = '共享占位关联异常 1 个，暂缓新增下载'
    shared.history_sync = { pending: 2, unverified: 3 }
  }
  if (new URLSearchParams(location.search).get('pack') === '1') {
    shared.requests = [{
      request_id: 'a'.repeat(32), title: 'Phoenix Rising S01E01-E06', phase: 'rejected', approved: 0,
      created: 1794711600, updated: 1794711660, task_name: 'Pack Site', downloader: 'QB', file_count: 6,
      files: Array.from({ length: 6 }, (_, index) => ({
        id: `file-${index}`, path: `Phoenix.S01E0${index + 1}.mkv`,
        media_title: '凤起微月', tmdb_id: 342129, media_type: 'tv', season: 1, episodes: [index + 1],
        specs: { resolution: '2160p', effects: 'HDR', codec: 'H.265', source: 'WEB-DL', fps: 60, size: 1024 ** 3 },
      })),
      rejected: Array.from({ length: 6 }, (_, index) => ({
        id: `file-${index}`, reason: '同规格已占位或已完成', owner: '设备B', state: 'completed', claim: String(index).repeat(32),
      })),
    }]
  }
  function recordPage(items, path) {
    const params = new URLSearchParams(path.split('?')[1])
    const query = (params.get('query') || '').toLowerCase().split(/\s+/).filter(Boolean)
    const status = params.get('status')
    const media = params.get('media_type')
    items = items.filter(row => (!status || (row.phase || row.state) === status)
      && (!media || row.media_type === media)
      && query.every(word => JSON.stringify(row).toLowerCase().includes(word)))
    const page = Math.max(1, Number(params.get('page') || 1))
    return { total: items.length, page, items: items.slice((page - 1) * 20, page * 20) }
  }
  window.resourceflowExtraRecords = 0
  const api = {
    get: async path => {
      window.resourceflowRequests.push({ method: 'GET', path })
      if (path.endsWith('/shared/status')) return window.resourceflowFailSharedLoad
        ? { success: false, message: '模拟共享读取失败' } : { success: true, data: structuredClone(shared) }
      if (path.includes('/shared/records?')) {
        const params = new URLSearchParams(path.split('?')[1])
        const kind = params.get('kind')
        const items = [...structuredClone(shared[kind]), ...Array.from({ length: window.resourceflowExtraRecords },
          (_, index) => ({ request_id: `search-${index}`, id: `search-${index}`, title: `Search Record item-${index}`,
            phase: 'completed', state: 'completed', media_type: 'tv', label: '搜索下载方', files: [], rejected: [],
          }))]
        const data = recordPage(items, path)
        if (window.resourceflowSlowSearch && params.get('query') === 'Slow') {
          await new Promise(resolve => setTimeout(resolve, 900))
        }
        return { success: true, data }
      }
      if (path.includes('/tasks/')) return { success: true, data: {
        task: structuredClone(savedTask), runs: [], torrents: { items: [], total: 0, page_size: 50 },
      } }
      if (path.endsWith('/status')) return { success: true, data: { ...structuredClone(status),
        tasks: savedTask ? [{ ...structuredClone(savedTask), site_name: 'Test Site', statistic: {},
          state: 'idle', next_run_at: null }] : [],
      } }
      if (path.includes('/resource-ledger?')) {
        if (authoritative && !path.includes('state=pending')) {
          const items = shared.records.filter(row => row.state === 'completed').map(row => ({
            ...row, key: row.id, evidence_source: 'shared',
          }))
          return { success: true, data: { ...recordPage(items, path), shared_authority: true } }
        }
        const items = [{ key: 'a'.repeat(64),
          title: path.includes('state=pending') ? 'Unknown Resource' : 'Film Resource',
          media_title: path.includes('state=pending') ? '待核验影片' : '测试电影',
          path: 'Film.2026.mkv', media_type: 'movie', tmdb_id: path.includes('state=pending') ? null : 123,
          specs: { resolution: '2160p' }, evidence_source: 'completed',
        }, ...Array.from({ length: window.resourceflowExtraRecords }, (_, index) => ({
          key: `ledger-${index}`, title: `Search Ledger item-${index}`, media_type: 'tv', season: 1, episodes: [index + 1],
          media_title: '测试剧集',
          tmdb_id: 333, specs: { resolution: '1080p' }, evidence_source: 'completed',
        }))]
        const data = recordPage(items, path)
        if (window.resourceflowSlowSearch && new URLSearchParams(path.split('?')[1]).get('query') === 'Slow') {
          await new Promise(resolve => setTimeout(resolve, 900))
        }
        return { success: true, data }
      }
      return { success: true, data: structuredClone(path.endsWith('/status') ? status : settings) }
    },
    post: async (path, body) => {
      body = JSON.parse(JSON.stringify(body))
      window.resourceflowRequests.push({ method: 'POST', path, body })
      if (path.endsWith('/shared/settings')) {
        if (window.resourceflowFailSave) return { success: false, message: '模拟共享保存失败' }
        const { bot_token, ...publicSettings } = body
        shared = { ...shared, ...publicSettings, token_configured: Boolean(bot_token || shared.token_configured) }
        return { success: true, data: structuredClone(shared) }
      }
      if (path.endsWith('/shared/test')) {
        shared.probe = { user_id: 11, policy: { revision: 'c'.repeat(64), attributes: ['resolution'], size_tolerance_pct: 3 } }
        settings = { ...settings, attributes: ['resolution'], size_tolerance_pct: 3 }
        return { success: true, data: structuredClone(shared) }
      }
      if (path.endsWith('/channel-dedup/settings')) {
        if (window.resourceflowFailStage === 'policy') return { success: false, message: '模拟规则保存失败' }
        if (window.resourceflowFailSave) return { success: false, message: '模拟保存失败' }
        const identity_aliases = Object.fromEntries((body.identity_aliases || '').split('\n').filter(Boolean)
          .map(line => line.split('=').map(item => item.trim()))
          .map(([name, id]) => [name, Number(id)]))
        const movie_identity_aliases = Object.fromEntries((body.movie_identity_aliases || '').split('\n').filter(Boolean)
          .map(line => line.split('=').map(item => item.trim()))
          .map(([name, id]) => [name, Number(id)]))
        settings = { ...settings, ...body, identity_aliases, movie_identity_aliases, channels: body.channels.split('\n').filter(Boolean) }
        return { success: true, data: structuredClone(settings) }
      }
      if (path === 'plugin/ResourceFlow/settings') {
        if (window.resourceflowFailStage === 'global') return { success: false, message: '模拟全局保存失败' }
        Object.assign(status, body)
        return { success: true, data: structuredClone(status) }
      }
      return { success: true, message: '已提交' }
    },
    put: async (path, body) => {
      window.resourceflowRequests.push({ method: 'PUT', path, body: structuredClone(body) })
      savedTask = structuredClone(body)
      return { success: true, data: { task: savedTask } }
    },
  }
  remote.init({
    vue: { [vue.version]: { get: () => () => vue, loaded: true } },
    vuetify: { [vuetify.version]: { get: () => () => vuetify, loaded: true } },
  })
  const factory = await remote.get('./Page')
  const app = vue.createApp({
    render: () => vue.h(vuetify.components.VApp, null, () => vue.h(factory(), { api })),
  })
  const ui = vuetify.createVuetify({
    components: vuetify.components, directives: vuetify.directives,
    theme: { defaultTheme: 'light', themes: { light: { colors: { primary: '#8b5cf6' } } } },
  })
  app.use(ui)
  window.resourceflowSetTheme = async name => {
    ui.theme.global.name.value = name
    await vue.nextTick()
  }
  app.mount('#app')
  window.resourceflowReady = true
</script>
</body>
</html>
